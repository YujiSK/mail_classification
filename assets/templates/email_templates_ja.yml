schema_version: "1.0"
shared:
  greetings:
    - "お世話になっております。"
    - "いつもお世話になっております。"
    - "サポートご担当者様"
    - "こんにちは。"
    - "はじめまして。"
    - "お忙しいところ恐れ入ります。"
  closings:
    - "ご確認のほど、よろしくお願いいたします。"
    - "お手数をおかけしますが、よろしくお願いいたします。"
    - "ご回答をお待ちしております。"
    - "ご教示いただけますと幸いです。"
    - "よろしくお願いします。"
    - "お忙しいところ恐縮ですが、ご対応をお願いいたします。"
  signatures:
    - ["--", "山田太郎", "株式会社サンプル"]
    - ["--", "佐藤花子", "有限会社ノースウインド"]
    - ["--", "鈴木一郎", "合同会社リバーサイド"]
    - ["--", "田中美咲", "メープルストリートデザイン"]
    - ["--", "高橋健太", "ヒルトップサービス"]
    - ["--", "伊藤さくら", "シーダーワークス"]
  senders:
    - "taro.yamada@example.net"
    - "hanako.sato@example.org"
    - "ichiro.suzuki@example.com"
    - "misaki.tanaka@example.net"
    - "kenta.takahashi@example.org"
    - "sakura.ito@example.com"
  subjects:
    - "お問い合わせ"
    - "ご確認をお願いいたします"
    - "サービスについての質問です"
    - "ご相談です"
    - "至急ご確認ください"
    - "フォローアップのご連絡"
  quoted_replies:
    - ["> お問い合わせいただきありがとうございます。", "> 詳細を教えてください。"]
    - ["> 以前のメッセージを受領いたしました。", "> 担当チームが確認いたします。"]
    - ["> これは自動返信です。", "> 今後のやり取りのため保管してください。"]
  urgency_lines:
    - ""
    - "お早めのご返信をいただけますと助かります。"
    - "特に急ぎではございません。"
    - "ご都合の良いタイミングでご返信ください。"

templates:
  # product_inquiry (製品問い合わせ) -- tg-ja-001..006 / semantic tg001..006
  - template_id: tpl-ja-001
    template_group: tg-ja-001
    semantic_template_id: tg001
    label: product_inquiry
    difficulty: easy
    contexts: ["小規模チームでの導入を検討しております。", "新しい部署でのサービス導入を計画しています。", "資料を見て検討中です。", "来月からの利用を考えています。"]
    main_requests: ["対応しているOSを教えていただけますでしょうか。", "パソコンとスマートフォンの両方で使えますか。", "動作環境を教えてください。", "対応プラットフォームの一覧はありますか。"]
    secondary_details: ["価格よりも互換性を重視しています。", "チームのメンバーはさまざまな端末を使っています。", "まだ契約はしていません。", "将来的な導入に向けた確認です。"]
  - template_id: tpl-ja-002
    template_group: tg-ja-002
    semantic_template_id: tg002
    label: product_inquiry
    difficulty: easy
    contexts: ["スタンダードプランを検討しています。", "拡大中のチーム向けのツールを探しています。", "先週デモを見せていただきました。", "含まれる機能を確認しています。"]
    main_requests: ["複数人で同時に編集できますか。", "一般的なファイル形式へのエクスポートに対応していますか。", "オフラインでも利用できますか。", "管理者はユーザー権限を管理できますか。"]
    secondary_details: ["機能について知りたいだけです。", "まだアカウントは作成していません。", "不具合の報告ではありません。", "簡単な機能概要をいただけると助かります。"]
  - template_id: tpl-ja-003
    template_group: tg-ja-003
    semantic_template_id: tg003
    label: product_inquiry
    difficulty: medium
    contexts: ["トライアル環境にはアクセスできますが、次の手順が分かりません。", "セットアップガイドにはいくつかの選択肢が書かれています。", "社内スタッフがコンサルタントなしで設定する予定です。", "同僚向けの手順書を準備しています。"]
    main_requests: ["推奨されるインストール方法を教えてください。", "初期設定の手順はどこで確認できますか。", "管理者権限がなくても導入できますか。", "新しいワークスペースはどのように設定すればよいですか。"]
    secondary_details: ["今のところ不具合は起きていません。", "簡潔な入門ページが見つかりません。", "修理ではなく手順の案内をお願いしたいです。", "https://example.invalid/setupの手順を確認しましたが、途中で止まっています。"]
  - template_id: tpl-ja-004
    template_group: tg-ja-004
    semantic_template_id: tg004
    label: product_inquiry
    difficulty: medium
    contexts: ["社内ネットワークの制限が厳しい環境です。", "利用条件を確認しています。", "外出先で作業することが多いチームです。", "申請前に詳細を確認しておきたいです。"]
    main_requests: ["通常利用に常時接続は必要ですか。", "推奨される通信速度はどれくらいですか。", "アップデートは手動でインストールできますか。", "iPhone 15でもブラウザからのアクセスは可能ですか。"]
    secondary_details: ["現在の接続自体は問題なく使えています。", "障害が起きているわけではありません。", "利用したことがまだありません。", "通常動作についての確認です。"]
  - template_id: tpl-ja-005
    template_group: tg-ja-005
    semantic_template_id: tg005
    label: product_inquiry
    difficulty: hard
    multi_intent: true
    secondary_intent: "評価中に警告が表示されたことに触れているが、主目的は機能確認"
    contexts: ["検証中に一度警告が表示されましたが、確認したいのは別の機能についてです。", "試用環境で一度エラーが出ましたが、主な関心は対応可否です。", "同僚が評価中に警告を報告してきましたが、今回は機能の質問です。", "デモ環境にアクセスできており、確認したい点があります。"]
    main_requests: ["暗号化されたアーカイブの取り込みには対応していますか。", "カレンダーと連携する方法はありますか。", "承認フローをカスタマイズできますか。", "レポートを自動でスケジュール送信できますか。"]
    secondary_details: ["その警告の調査は今回の本題ではありません。", "エラーは出ましたが、機能面の確認が優先です。", "警告の調査は今回不要です。", "機能があるかどうかだけ教えてください。"]
  - template_id: tpl-ja-006
    template_group: tg-ja-006
    semantic_template_id: tg006
    label: product_inquiry
    difficulty: hard
    contexts: ["サービス自体は問題なく動いています。", "基本画面には特に支障なくアクセスできています。", "壊れているわけではなさそうです。", "エラーは表示されておらず、普通に使えています。"]
    main_requests: ["自動リマインダーの設定方法を教えてください。", "ワークスペースのレイアウトはどう変更すればよいですか。", "特定のイベントだけ通知を有効にする方法はありますか。", "チーム全体のデフォルト設定はどこにありますか。"]
    secondary_details: ["障害が起きているわけではありません。", "手順が見つからないだけで、動作自体は問題ありません。", "修理ではなく設定の案内をお願いします。", "エラーはなく、手順だけ知りたいです。"]

  # technical_issue (技術的不具合) -- tg-ja-007..012 / semantic tg007..012
  - template_id: tpl-ja-007
    template_group: tg-ja-007
    semantic_template_id: tg007
    label: technical_issue
    difficulty: easy
    contexts: ["昨日までデスクトップアプリは問題なく動いていました。", "今朝、最新のアップデートを適用しました。", "サービスは最初は正常に起動します。", "メイン画面までは問題なく到達できます。"]
    main_requests: ["保存したファイルを開くたびに強制終了します。", "エクスポートを選択するとアプリが落ちます。", "同期を始めるたびにエラーが表示されます。", "ドキュメントをアップロードすると画面が固まります。"]
    secondary_details: ["再起動しても改善しません。", "設定は特に変更していません。", "毎回同じ現象が起きます。", "作業を完了できずに困っています。"]
  - template_id: tpl-ja-008
    template_group: tg-ja-008
    semantic_template_id: tg008
    label: technical_issue
    difficulty: easy
    contexts: ["インターネット自体は他のサイトで問題なく使えています。", "他のアプリはネットワークに接続できています。", "ブラウザ自体はオンラインです。", "端末の接続は安定しています。"]
    main_requests: ["サービスがサーバーに接続できません。", "アクセスするとタイムアウトになります。", "ワークスペースの読み込みが終わりません。エラーがずっと出ます。", "この端末からダッシュボードに到達できません。"]
    secondary_details: ["今朝までは使えていました。", "プロキシの設定は変更していません。", "同僚は別の端末から接続できています。", "何度試しても同じ現象です。"]
  - template_id: tpl-ja-009
    template_group: tg-ja-009
    semantic_template_id: tg009
    label: technical_issue
    difficulty: medium
    contexts: ["最近の操作が以前よりかなり時間がかかります。", "最終的には応答しますが、時間がかかります。", "処理は完了しますが、以前より大幅に時間がかかります。", "同じファイルでも以前は素早く開けていました。"]
    main_requests: ["なぜここまで動作が遅くなったのでしょうか。最近すごーく重くて困っています。", "繰り返し発生する遅延の原因を特定したいです。", "原因調査のため、どのログや環境情報を取得すればよいでしょうか。", "毎回の操作の後、画面が1分ほど止まります。改善方法はありますか。"]
    secondary_details: ["完全に止まっているわけではありません。", "アカウント自体は問題なくアクセスできます。", "以前は同じ操作が数秒で完了していました。", "エラーコードは表示されません。"]
  - template_id: tpl-ja-010
    template_group: tg-ja-010
    semantic_template_id: tg010
    label: technical_issue
    difficulty: medium
    contexts: ["別の端末でも同じアカウントを使っています。", "変更内容は保存されているはずです。", "しばらく待っても状況は同じです。", "何度か同期を試しました。"]
    main_requests: ["編集した内容が他の端末に反映されません。", "同期のステータスが「完了」のまま更新が反映されません。", "最新の変更が一向に反映されません。", "同期エラーは出ないのに内容が反映されないままです。"]
    secondary_details: ["請求の話ではありません。", "支払いに関する問題ではありません。", "とにかく内容が更新されないことが問題です。", "別の端末では正しく反映されています。"]
  - template_id: tpl-ja-011
    template_group: tg-ja-011
    semantic_template_id: tg011
    label: technical_issue
    difficulty: hard
    multi_intent: true
    secondary_intent: "支払いが完了したことに触れているが、主目的はサービス復旧"
    contexts: ["支払いは完了しましたが、サービスが使えません。", "更新手続きが終わった直後にアクセスできなくなりました。", "今朝支払いが完了し、アプリは障害状態を示しています。", "領収書は届きましたが、ワークスペースが開きません。"]
    main_requests: ["利用できなくなっているサービスを復旧してください。", "支払い済みのサービスが使えない理由を調査していただけますか。", "接続障害の解決を最優先でお願いします。", "まずは障害の解消をお願いします。"]
    secondary_details: ["現時点で返金を求めているわけではありません。", "支払いの件は状況説明のために触れただけです。", "タイミングを伝えるために領収書に触れました。", "支払いよりもサービス障害のほうが優先度が高いです。"]
  - template_id: tpl-ja-012
    template_group: tg-ja-012
    semantic_template_id: tg012
    label: technical_issue
    difficulty: hard
    contexts: ["別の端末では同じ認証情報でログインできています。", "ウェブサイトからはサインインできます。", "アカウント情報は正しく表示されています。", "パスワードの再設定は無事完了しました。"]
    main_requests: ["デスクトップアプリだけが同期できません。", "デスクトップアプリの認証エラーで、サーバーに接続できません。", "Web版には同じ認証情報でログインできますが、デスクトップアプリではログイン直後に切断され、同期を開始できません。", "デスクトップアプリだけ、認証直後に接続が切れて同期が止まってしまいます。"]
    secondary_details: ["パスワード自体は問題ないはずです。", "接続の挙動を調査していただきたいです。", "パスワードではなく、アプリ側の接続状況を確認していただきたいです。", "問題はログイン後のアプリの接続に起きているようです。"]

  # billing (請求) -- tg-ja-013..018 / semantic tg013..018
  - template_id: tpl-ja-013
    template_group: tg-ja-013
    semantic_template_id: tg013
    label: billing
    difficulty: easy
    contexts: ["最新の明細を確認しました。", "本日新しい領収書が届きました。", "カードの利用履歴（１２月分）を確認しました。", "月次の明細が確認できる状態です。"]
    main_requests: ["同じ金額が二回請求されているのはなぜですか。", "二重になっている請求について教えてください。", "同じ注文に対して同一日付の支払いが二件あります。", "重複した支払いを修正していただけますか。"]
    secondary_details: ["購入したのは一回だけです。", "両方の記録が同じ日付になっています。", "二件目の注文は存在しません。", "サービス自体は問題なく利用できています。"]
  - template_id: tpl-ja-014
    template_group: tg-ja-014
    semantic_template_id: tg014
    label: billing
    difficulty: easy
    contexts: ["今後の支払い方法を変更したいです。", "現在のカードがまもなく有効期限を迎えます。", "経理担当から新しいカードが発行されました。", "次回更新に向けて準備しています。"]
    main_requests: ["支払い方法はどのように変更できますか。", "登録済みのカード情報はどこで更新できますか。", "今後の請求を別のカードにできますか。", "支払い情報の変更手順を教えてください。"]
    secondary_details: ["支払いが失敗したわけではありません。", "次回のサイクルに向けての確認です。", "現在のプランはそのまま継続します。", "アクセス自体は今も可能です。"]
  - template_id: tpl-ja-015
    template_group: tg-ja-015
    semantic_template_id: tg015
    label: billing
    difficulty: medium
    contexts: ["明細の合計金額が想定より高くなっています。", "今月の費用を確認しているところです。", "領収書に複数の項目が記載されています。", "経理担当から内訳の確認を依頼されました。"]
    main_requests: ["この金額の算出方法を説明していただけますか。", "追加の項目が何を指しているのか教えてください。", "合計の内訳をいただけますか。", "先月と更新金額が異なるのはなぜですか。"]
    secondary_details: ["返金を希望しているわけではありません。", "チャージバックの予定はありません。", "明細の内容を理解したいだけです。", "サービスは通常どおり利用できています。"]
  - template_id: tpl-ja-016
    template_group: tg-ja-016
    semantic_template_id: tg016
    label: billing
    difficulty: medium
    contexts: ["先日、解約手続きを行いました。", "先週プランが終了しました。", "プラン停止の確認メールを受け取りました。", "アカウントにアクティブなプランが表示されなくなりました。"]
    main_requests: ["返金はいつカードに反映されますか。", "返金状況を確認していただけますか。", "返金がまだ反映されていないのですが、いつ頃になりますか。", "返金が処理されたかどうか確認をお願いします。"]
    secondary_details: ["まだ反映が確認できていません。", "明細を見ても一度も表示されていません。", "元の支払い記録は確認できます。", "解約時の受付番号は控えています。"]
  - template_id: tpl-ja-017
    template_group: tg-ja-017
    semantic_template_id: tg017
    label: billing
    difficulty: hard
    multi_intent: true
    secondary_intent: "解約は望んでいないが、次回請求の停止を優先している"
    contexts: ["サービス自体は今後も使い続けたいと考えています。", "解約は考えていませんが、今の状況では困っています。", "プランを維持したまま調整したいことがあります。", "今のところ利用を続けるつもりです。"]
    main_requests: ["解約したいわけではないのですが、次回の請求だけ止められますか。", "契約は残したまま、次回の支払いだけ保留できますか。", "サービスは続けたいので、今回の請求だけ見送っていただけますか。", "解約ではなく、一時的に請求だけ止める方法はありますか。"]
    secondary_details: ["完全な解約は希望していません。", "アカウント自体はこのまま残したいです。", "サービスの利用自体には満足しています。", "請求のタイミングだけ調整したいという相談です。"]
  - template_id: tpl-ja-018
    template_group: tg-ja-018
    semantic_template_id: tg018
    label: billing
    difficulty: hard
    contexts: ["明細に見覚えのない項目があります。", "請求書に聞き慣れない説明が記載されています。", "見覚えのない領収書を受け取りました。", "メモしていた金額と差異があります。"]
    main_requests: ["返金ではなく、この請求の内容を説明していただきたいです。", "まだ返金は希望していません。まず内容を教えてください。", "取り消す前に、これが何の請求か確認させてください。", "返金手続きを始める前に、項目の内容を特定していただけますか。"]
    secondary_details: ["不正利用だと決めつけているわけではありません。", "解約を希望しているわけでもありません。", "どの購入に対応するのか分かりません。", "この請求に心当たりがありません。"]

  # account_support (アカウント支援) -- tg-ja-019..024 / semantic tg019..024
  - template_id: tpl-ja-019
    template_group: tg-ja-019
    semantic_template_id: tg019
    label: account_support
    difficulty: easy
    contexts: ["ログイン画面にアクセスしています。", "昨日まではアカウントに問題なくアクセスできていました。", "いつも使っている端末からアクセスしています。", "登録したメールアドレスはサービス側でも認識されています。"]
    main_requests: ["ログインできません。困っています。", "ログイン出来ない状態がずっと続いています。", "パスワードを忘れた場合、どうすればアクセスを取り戻せますか。", "サインインの試行が一度も成功しません。"]
    secondary_details: ["支払いに関する質問ではありません。", "既存のアカウントにログインしたいだけです。", "まだ再設定リンクは申請していません。", "メール自体は普通に受信できています。"]
  - template_id: tpl-ja-020
    template_group: tg-ja-020
    semantic_template_id: tg020
    label: account_support
    difficulty: easy
    contexts: ["最近、転職しました。", "以前のメールアドレスはまもなく使えなくなります。", "アカウントへのアクセスは今も可能です。", "連絡先情報を更新する必要があります。"]
    main_requests: ["アカウントに登録しているメールアドレスはどのように変更できますか。", "登録メールアドレスをsupport.user@example.invalidへ変更したいのですが、どこから行えますか。", "サポートに連絡先を更新してもらうことはできますか。", "新しいメールアドレスへ切り替える手順を教えてください。"]
    secondary_details: ["現在の認証情報はまだ有効です。", "サービスのエラーは表示されていません。", "同じアカウントを維持したいです。", "プランは変更しないままにしたいです。"]
  - template_id: tpl-ja-021
    template_group: tg-ja-021
    semantic_template_id: tg021
    label: account_support
    difficulty: medium
    contexts: ["何度かログインに失敗しました。", "アカウントにロックのメッセージが表示されています。", "しばらく時間を置いてから再度試しました。", "サインイン画面でアクセス制限と表示されます。"]
    main_requests: ["アカウントのロックを解除するにはどうすればよいですか。", "ロックアウト後のアクセス回復をお願いできますか。", "ロック解除にはどのような確認が必要ですか。", "新しいアカウントを作らずにアクセスを回復する方法はありますか。"]
    secondary_details: ["同じパスワードが今朝までは使えていました。", "パスワード自体は今も正しいはずです。", "本人確認の質問には答えられます。", "請求に関する問題ではありません。"]
  - template_id: tpl-ja-022
    template_group: tg-ja-022
    semantic_template_id: tg022
